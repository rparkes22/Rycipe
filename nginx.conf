server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location ~* \.(woff2|css|js)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
